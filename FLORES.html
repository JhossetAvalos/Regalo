<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz Aniversario 🌷</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="icon" href="img/flowers.png" type="image/x-icon">
</head>

<body onclick="PlayAudio()">
  <div class="night"></div>

  <!-- 💖 Mensaje central -->
  <div class="description">
    <h1>Feliz aniversario, mi amor 🌸</h1>
    <p>“Cada día contigo florece algo hermoso en mi corazón.” 💞</p>
  </div>

  <!-- 🌷 Flores tulipanes -->
  <div class="flowers">
    <div class="tulip" style="--d:0s;">
      <div class="stem"></div>
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
    </div>

    <div class="tulip" style="--d:0.5s;">
      <div class="stem"></div>
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
    </div>

    <div class="tulip" style="--d:1s;">
      <div class="stem"></div>
      <div class="petal petal1"></div>
      <div class="petal petal2"></div>
      <div class="petal petal3"></div>
      <div class="petal petal4"></div>
    </div>
  </div>

  <!-- 🎵 Música -->
  <audio id="musica" autoplay loop>
    <source src="videoplayback.mp3" type="audio/mpeg">
    <source src="videoplayback.ogv" type="audio/ogg">
  </audio>

  <script>
    function PlayAudio() {
      document.getElementById("musica").play();
    }
  </script>
</body>
</html>
